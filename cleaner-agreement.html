<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cleaner Agreement — CleanSnap</title>
  <meta name="description" content="The agreement between CleanSnap and independent cleaning professionals using the platform.">
  <link rel="icon" type="image/png" href="/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: Inter, system-ui, -apple-system, sans-serif; }
    /* The legal documents arrive as bare h2/h3/p/ul/table with no classes, so
       the styling has to come from here rather than from Tailwind utilities. */
    .doc h2 { font-size: 1.25rem; font-weight: 700; color: #0f172a; margin: 2rem 0 .75rem; }
    .doc h3 { font-size: 1.05rem; font-weight: 600; color: #0f172a; margin: 1.5rem 0 .5rem; }
    .doc p { margin: .75rem 0; color: #334155; line-height: 1.7; }
    .doc ul, .doc ol { margin: .75rem 0 .75rem 1.25rem; color: #334155; line-height: 1.7; }
    .doc ul { list-style: disc; } .doc ol { list-style: decimal; }
    .doc li { margin: .35rem 0; }
    .doc a { color: #0284c7; text-decoration: underline; }
    .doc strong { color: #0f172a; }
    .doc table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: .925rem; display: block; overflow-x: auto; }
    .doc th, .doc td { border: 1px solid #e2e8f0; padding: .6rem .75rem; text-align: left; vertical-align: top; color: #334155; }
    .doc th { background: #f8fafc; color: #0f172a; font-weight: 600; }
    .doc em { font-style: italic; }
  </style>
</head>
<body class="bg-white text-gray-900 antialiased">
  <div id="site-nav"></div>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-1">Cleaner Agreement</h1>
    <p id="legal-meta" class="text-sm text-gray-500 mb-8">Loading the current version&hellip;</p>

    <div id="legal-content" class="doc">
      <p class="text-gray-500">Loading&hellip;</p>
    </div>

    <p class="mt-12 text-sm text-gray-500 border-t border-gray-200 pt-6">
      This is the version currently in force. Questions about it go to
      <a class="text-brand-600 underline" href="mailto:support@cleansnap.co.uk">support@cleansnap.co.uk</a>.
    </p>
  </main>

  <script src="/legal.js"></script>
  <script>renderLegalDocument("CLEANER_AGREEMENT", "Cleaner Agreement");</script>
  <div id="site-footer"></div>
  <script src="/legal-page.js"></script>
</body>
</html>
